[package]
name = "ai_cli"
version = "1.0.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.53", features = ["derive"] }
tokio = { version = "1.49.0", features = ["full"] }
reqwest = { version = "0.12.26", default-features = false, features = ["rustls-tls", "blocking", "json"] }
scraper = "0.21"
headless_chrome = "1.0"
htmd = "0.5"
url = "2.5"

anyhow = "1.0.100"
thiserror = "2.0.17"
tracing = "0.1.43"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
which = "7"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
dirs = "5"
toml = "0.8.11"
readability = { version = "0", default-features = false }
oracle = "0.6"
calamine = "0.36"
rust_xlsxwriter = "0.96"
umya-spreadsheet = "~2.3"

# 二进制目标
[[bin]]
name = "ai_cli"
path = "src/main.rs"

[[bin]]
name = "web_fetch"
path = "src/bin/web_fetch.rs"

[[bin]]
name = "db_tool"
path = "src/bin/db_tool.rs"

[[bin]]
name = "excel_tool"
path = "src/bin/excel_tool.rs"
