[package]
name = "gui_tool"
version = "1.0.0"
edition = "2024"

[dependencies]

iced-kit = "0.1.0"
iced_aw = "0.14"
native-theme-iced = "0.7"
iced_modifier = "0.5.1"
iced_plot = "0.4.0"
iced_navigation = { version = "1.6.0", features = ["drawer"] }
iced_split = "0.1.0"
iced_futures = "0.14.0"
iced = { version = "0.14", default-features = false, features = [
    "wgpu",
    "tokio",
    "advanced",
    "thread-pool"
] }


serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.145"
dirs = "6.0"
tokio = { version = "1.49.0", features = ["full"] }
rayon = "1.10"
pnet = "0.35.0"

anyhow = "1.0.100"
thiserror = "2.0.17"
log = "0.4.22"
tracing = "0.1.43"
futures = "0.3.31"
pnet_sys = "0.35.0"
async-trait = "^0.1"
glam = { version = "0.25.0", features = ["bytemuck"] }
bytemuck = { version = "1.0", features = ["derive"] }
iced-shadcn = "0.5.1"


[features]
default = ["net_scan", "net_capture", "json_fmt", "iced_aw"]

net_scan = []
net_capture = []
json_fmt = []
iced_aw = []
