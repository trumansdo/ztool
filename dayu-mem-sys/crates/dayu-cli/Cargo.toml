[package]
name = "dayu-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
dayu-core = { path = "../dayu-core" }
dayu-domain = { path = "../dayu-domain" }
dayu-storage = { path = "../dayu-storage" }
dayu-config = { path = "../dayu-config" }
dayu-embedding = { path = "../dayu-embedding" }
tokio = { workspace = true, features = ["rt", "macros"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json.workspace = true
chrono.workspace = true

[features]
# CLI 的所有子命令都需要嵌入后端；系统已无 mock 回退。
# 默认 onnx；改用 HTTP 接口：--no-default-features --features http
default = ["onnx"]
onnx = ["dayu-core/onnx", "dayu-embedding/onnx"]
http = ["dayu-core/http", "dayu-embedding/http"]
test-support = ["dayu-core/test-support", "dayu-embedding/test-support"]
