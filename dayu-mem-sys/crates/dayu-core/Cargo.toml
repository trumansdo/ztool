[package]
name = "dayu-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
dayu-domain = { path = "../dayu-domain" }
dayu-flow = { path = "../dayu-flow" }
dayu-judge = { path = "../dayu-judge" }
dayu-storage = { path = "../dayu-storage" }
dayu-embedding = { path = "../dayu-embedding" }
dayu-config = { path = "../dayu-config" }
dayu-observability = { path = "../dayu-observability" }
chrono.workspace = true
tracing.workspace = true
thiserror.workspace = true

[features]
default = []
onnx = ["dayu-embedding/onnx"]
http = ["dayu-embedding/http"]
# 确定性测试后端（仅测试用）
test-support = ["dayu-embedding/test-support"]
# 判别器后端单独开关：需要额外拉起一个 ONNX Environment（ort 每进程只允许一个），
# 嵌入与判别各建一个会互斥，因此默认不并进 `onnx`。
judge-onnx = ["onnx", "dayu-judge/onnx"]

[dev-dependencies]
dayu-storage = { path = "../dayu-storage", features = ["test-support"] }
# 单元测试不再依赖真实模型：`test-support` 提供确定性哈希后端。
# 需要真实语义的用例单独用 `#[cfg(feature = "onnx")]` 门控。
dayu-embedding = { path = "../dayu-embedding", features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt"] }
dayu-testkit = { path = "../dayu-testkit" }
