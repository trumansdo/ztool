[package]
name = "dayu-napi"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[features]
# napi 的唯一用途是被 Node 加载，因此默认开启 onnx；
# 只用 HTTP 接口时：--no-default-features --features http
# 只用确定性后端冒烟时：--no-default-features --features test-support
default = ["onnx"]
# ONNX Runtime 本地模型（config.embedding_backend = "onnx"）
onnx = ["dayu-core/onnx", "dayu-embedding/onnx"]
# OpenAI 兼容 HTTP 接口（config.embedding_backend = "http"）
http = ["dayu-core/http", "dayu-embedding/http"]
# 确定性哈希向量，仅用于本地冒烟/规模测试（config.embedding_backend = "test"）
test-support = ["dayu-core/test-support", "dayu-embedding/test-support"]

[dependencies]
napi = { version = "3", features = ["tokio_rt", "async"] }
napi-derive = "3"
dayu-core = { path = "../dayu-core" }
dayu-domain = { path = "../dayu-domain" }
dayu-storage = { path = "../dayu-storage" }
dayu-observability = { path = "../dayu-observability" }
dayu-embedding = { path = "../dayu-embedding", default-features = false }
tracing.workspace = true
once_cell = "1"
tokio = { workspace = true, features = ["rt", "macros"] }
toml = "0.8"
chrono.workspace = true

[build-dependencies]
napi-build = "2"

[dev-dependencies]
tempfile = "3"
dayu-storage = { path = "../dayu-storage", features = ["test-support"] }
dayu-testkit = { path = "../dayu-testkit" }
