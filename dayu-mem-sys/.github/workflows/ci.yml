name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  dep-check:
    name: Dependency Direction Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: dayu-domain must have zero workspace deps
        run: |
          deps=$(cargo tree -p dayu-domain --depth 1 2>/dev/null | grep -c "dayu-" || true)
          if [ "$deps" -gt 0 ]; then
            echo "ERROR: dayu-domain depends on $deps workspace crates (must be 0)"
            exit 1
          fi
      - name: dayu-flow must not depend on triviumdb/ort/napi
        run: |
          for forbidden in triviumdb ort napi; do
            if cargo tree -p dayu-flow 2>/dev/null | grep -qi "$forbidden"; then
              echo "ERROR: dayu-flow depends on forbidden crate: $forbidden"
              exit 1
            fi
          done
          echo "dayu-flow dependency direction OK"
