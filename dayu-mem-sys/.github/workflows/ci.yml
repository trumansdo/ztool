name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  no-disk-cache-in-core:
    name: No Disk Cache In Core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 向量缓存只允许存在于 test/lib/（测试工具）。核心 crate 每次都必须
      # 真的调嵌入模型——真实使用不能读缓存，否则换了模型还会拿旧向量。
      - name: crates/ must not touch vector cache files
        run: |
          hits=$(grep -rnE 'CACHE_DIR|cache_path|cachePath|test/data/cache' crates/ --include='*.rs' || true)
          if [ -n "$hits" ]; then
            echo "ERROR: 核心 crate 出现磁盘缓存痕迹（缓存只能在 test/lib/ 下）："
            echo "$hits"
            exit 1
          fi
          echo "核心 crate 无磁盘缓存痕迹 OK"

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  dep-check:
    name: Dependency Direction Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: dayu-domain must have zero workspace deps
        run: |
          deps=$(cargo tree -p dayu-domain --depth 1 2>/dev/null | grep -c "dayu-" || true)
          if [ "$deps" -gt 0 ]; then
            echo "ERROR: dayu-domain depends on $deps workspace crates (must be 0)"
            exit 1
          fi
      - name: dayu-flow must not depend on triviumdb/ort/napi
        run: |
          for forbidden in triviumdb ort napi; do
            if cargo tree -p dayu-flow 2>/dev/null | grep -qi "$forbidden"; then
              echo "ERROR: dayu-flow depends on forbidden crate: $forbidden"
              exit 1
            fi
          done
          echo "dayu-flow dependency direction OK"
