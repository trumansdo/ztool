# 冒烟测试配置（LM Studio 本地 HTTP 嵌入）
#
# 与 config-http.toml 的唯一差异：嵌入后端指向本机 LM Studio，模型换成 0.6B。
# 用于「仅换嵌入模型」的对照实验，其余参数必须与 config-http.toml 逐字一致。
#
# 全部通过 HTTP 接口调用远程嵌入模型，不需要 ONNX / GGUF / 本地模型文件。
# 构建：cargo build -p dayu-napi --release --no-default-features --features http
# 运行：node test/smoke-http.cjs

# --- 存储 ---
db_path = "test/smoke-lms.tdb"

# --- 嵌入（HTTP 后端）---
embedding_backend = "http"
# 留空则启动时探测一次（Qwen3-Embedding-0.6B = 1024 维）
# embedding_dim = 2560
embedding_api_base = "http://127.0.0.1:1234/v1"
embedding_api_key = "lm-studio"
embedding_api_model = "text-embedding-qwen3-embedding-0.6b"

# --- 流动 ---
max_flow_depth = 5
max_lit_ball_count = 50
min_water_threshold = 0.01
total_water_budget = 2.5
supplement_ratio = 0.2
max_supplement_ratio = 2.0
supplement_threshold = 0.45
split_mode = "Weighted"
strong_cue_threshold = 0.8
strong_cue_multiplier = 3.0

# --- 起始球 ---
start_top_n = 5
start_ball_threshold = 0.3
start_ball_relative_threshold = 0.85
# 起始球同义去重：与已选起始球余弦 >= 此值则跳过（0 = 关闭）
# 实测副本 0.969、口语/书面同义 0.976，语义反转（喜欢/不喜欢）也有 0.828，故卡 0.95
start_dedupe_threshold = 0.95

# --- 损失 ---
base_loss = 0.2
loss_pipe_factor = 0.8
loss_max = 0.8

# --- 路径与结算 ---
discount_per_hop = 0.1
min_discount = 0.5
flow_context_blend_alpha = 0.2
strengthen_eligibility_threshold = 0.7
impression_threshold = 0.3
render_clear_threshold = 0.7
render_deep_impression_threshold = 0.6
render_impression_threshold = 0.5
min_strengthen_value = 0.05
base_reinforcement = 0.1
supplement_reinforce_ratio = 0.5
min_reinforcement_threshold = 0.001
pipe_strengthen_factor = 0.05
min_pipe_reinforce_threshold = 0.01
size_saturation_gamma = 1.0
sort_exponent_a = 1.0
sort_exponent_b = 0.0

# --- 注入 ---
injection_mode = "Token"
token_budget = 2048
max_balls_per_inject = 10
chars_per_token = 4
tokens_per_size = 20.0
pipe_thickness_ceiling = 1.0

# --- 归档 ---
archive_inactive_days = 90.0
archive_size_threshold = 0.2
max_active_balls = 100000

# --- 多源 ---
multi_source_overlap_threshold = 0.3
multi_source_merge_cap = 1.5
source_bonus = 0.2
source_cap = 2.0

# --- 可观测性 ---
log_dir = "test/logs-http"
log_level = "info"
log_retention_days = 3
metrics_enabled = true
metrics_retention_days = 3
